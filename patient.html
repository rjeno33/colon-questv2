
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Colon Quest - Patient Portal</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f8fb;
            margin: 0;
            padding: 20px;
        }

        .patient-container {
            max-width: 700px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        h1 {
            color: #238db8;
            text-align: center;
        }

        .intro {
            text-align: center;
            line-height: 1.6;
            color: #555;
        }

        .start-button {
            display: block;
            width: 100%;
            padding: 15px;
            margin-top: 25px;
            background: #41B6E6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
        }

        .start-button:hover {
            background: #238db8;
        }
        
label {
    display: block;
    margin-top: 18px;
    margin-bottom: 6px;
    font-weight: bold;
    color: #333;
}

input,
select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box;
    font-size: 16px;
}

hr {
    margin-top: 30px;
    border: none;
    border-top: 1px solid #ddd;
}
        
.medication-checkbox {
    width: auto;
    margin-right: 8px;
}

.medication-details {
    background: #f3f8fb;
    padding: 15px;
    margin: 10px 0 20px 0;
    border-radius: 8px;
}

.medication-details[hidden] {
    display: none;
}

textarea {
    width: 100%;
    padding: 12px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-family: Arial, sans-serif;
    font-size: 16px;
}


    </style>
</head>

<body>

    <div class="patient-container">


<div class="patient-container">

    <h1>Colon Quest</h1>

    <h2>Let's get to know you</h2>

    <p class="intro">
        Please enter your details below so we can help
        your hospital team prepare your instructions.
    </p>

    <form id="patientForm">

        <label for="firstName">First name</label>
        <input type="text" id="firstName" required>

        <label for="lastName">Last name</label>
        <input type="text" id="lastName" required>

        <label for="dateOfBirth">Date of birth</label>
        <input type="date" id="dateOfBirth" required>

        <label for="hospital">Hospital / Trust</label>
        <select id="hospital" required>
            <option value="">Please select</option>
            <option value="sheffield">Sheffield Teaching Hospitals</option>
            <option value="test">Test Hospital</option>
        </select>

        <label for="hospitalNumber">Hospital number (if known)</label>
        <input type="text" id="hospitalNumber">

        <hr>

        <h2>Your procedure</h2>

        <label for="appointmentDate">Procedure date</label>
        <input type="date" id="appointmentDate" required>

        <label for="appointmentTime">Procedure time</label>
        <input type="time" id="appointmentTime" required>

        <button type="submit" class="start-button">
            Continue
        </button>

    </form>

</div>


    <script src="patient.js"></script>

</body>
</html>
